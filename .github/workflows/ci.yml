name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset:
    name: Changeset Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require a Changeset
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'changeset-release/main'
        run: npx changeset status --since=origin/main
      - name: Release PR already contains version metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'changeset-release/main'
        run: echo "Changesets generated this release PR; no new Changeset is required."

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: bash scripts/project-acceptance.sh
      - name: Test interactive PTY cancellation
        run: bash scripts/pty-smoke.sh
        timeout-minutes: 2

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: bun test
      - run: npm run build
      - run: bash scripts/package-smoke.sh

  isolated-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: SKILLOOM_ALLOW_GLOBAL_ACCEPTANCE=1 bash scripts/global-acceptance.sh
